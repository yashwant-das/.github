name: Documentation
on:
  workflow_call:
    inputs:
      standards-ref:
        description: Full commit SHA matching the central workflow reference
        required: true
        type: string
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable tools reference
        env:
          STANDARDS_REF: ${{ inputs.standards-ref }}
        shell: bash
        run: |
          if [[ ! "$STANDARDS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'standards-ref must be a full 40-character commit SHA'
            exit 1
          fi
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository
          persist-credentials: false
      - name: Checkout central tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yashwant-das/.github
          ref: ${{ inputs.standards-ref }}
          path: standards-tools
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked central tools
        working-directory: standards-tools
        run: npm ci --ignore-scripts
      - name: Validate documentation profile and local file links
        run: python3 standards-tools/scripts/validate_docs.py repository
      - name: Check Markdown with central configuration
        run: node standards-tools/scripts/lint_docs.mjs repository
