# Publish the central repository first. Replace BOTH placeholders with its
# same full 40-character commit SHA before adding this to a consumer repository.
name: Standards
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  documentation:
    uses: yashwant-das/.github/.github/workflows/documentation.yml@PUBLISHED_COMMIT_SHA
    with:
      standards-ref: PUBLISHED_COMMIT_SHA
